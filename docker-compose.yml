services:
  postgres:
    image: postgres:17-alpine
    container_name: gourmet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gourmet26
      POSTGRES_USER: gourmet26
      POSTGRES_PASSWORD: gourmet26
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gourmet26 -d gourmet26"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.4
    container_name: gourmet-mailpit
    restart: unless-stopped
    ports:
      - "1026:1026"
      - "8026:8026"

volumes:
  postgres_data:
